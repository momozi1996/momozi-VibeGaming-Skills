name: Verify frozen packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check every package and the release inventory
        run: python scripts/audit_packages.py --check-lock
      - name: Check repository helper tests
        run: python -B scripts/test_release_tools.py
      - name: Check CSGame offline restore and launcher
        run: python -B skills/csgame/scripts/test_game.py
      - name: Check train and MOBA offline restore and launchers
        run: |
          python -B skills/huochegame/scripts/test_game.py
          python -B skills/wangzhegame/scripts/test_game.py
